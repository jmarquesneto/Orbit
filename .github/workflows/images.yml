# Publica as imagens prontas no GitHub Container Registry (ghcr.io), para instalar em
# NAS/servidores só com "docker compose pull" — sem copiar o código nem compilar lá.
#
#   ghcr.io/<dono>/orbit-web   ghcr.io/<dono>/orbit-api   ghcr.io/<dono>/orbit-db
#
# Tags: "latest" (último push nos branches abaixo) e "sha-<commit>" (versão exata).
name: Imagens Docker

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: orbit-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            file: apps/web/Dockerfile
          - image: api
            context: .
            file: apps/api/Dockerfile
          - image: db
            context: infra/db
            file: infra/db/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # O registro exige nome em minúsculas (o dono pode ter maiúsculas).
      - name: Nome da imagem
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orbit-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=orbit-${{ matrix.image }}

      # amd64 (PC/NAS comum) e arm64 (Raspberry Pi e NAS ARM).
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
