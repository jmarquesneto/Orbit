# =======================================================================================
#  Nginx na frente do contêiner "web" (proxy reverso com TLS).
#
#  - Porta 80: só redireciona (301) para HTTPS — e responde o desafio do Let's Encrypt.
#  - Porta 443: TLS + HSTS + cabeçalhos de isolamento entre origens.
#
#  Ajuste os pontos marcados com  <<< ALTERE . Se o Nginx não estiver na mesma rede
#  Docker do Vesta, troque "web:3000" por "IP-DO-NAS:3010".
# =======================================================================================

upstream vesta_web {
    server web:3000;            # <<< ALTERE se preciso (ex.: 192.168.1.50:3010)
    keepalive 16;
}

# ------------------------------------------------------------------- HTTP → HTTPS (301)
server {
    listen 80;      # IPv6: acrescente "listen [::]:80;" só se a rede Docker tiver IPv6
    server_name vesta.exemplo.com;   # <<< ALTERE (seu domínio)

    # Renovação do certificado (certbot/Let's Encrypt, modo webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nada de HSTS aqui: o cabeçalho só tem efeito (e só deve ir) em respostas HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------ HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name vesta.exemplo.com;   # <<< ALTERE (seu domínio)

    ssl_certificate     /etc/nginx/certs/fullchain.pem;   # <<< ALTERE
    ssl_certificate_key /etc/nginx/certs/privkey.pem;     # <<< ALTERE
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:VestaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 6m;   # extratos OFX até 5 MB

    # O app também envia estes cabeçalhos; escondemos os dele para não sair duplicado
    # e o Nginx passa a ser a fonte única deles na borda.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;

    # "always": vale também para respostas de erro (4xx/5xx).
    # Atenção: um add_header dentro de "location" anula TODOS estes; não use add_header lá.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    # Nome do sistema ao vivo (Server-Sent Events): sem buffer e com conexão longa.
    location = /api/branding/events {
        proxy_pass http://vesta_web;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://vesta_web;
    }
}
