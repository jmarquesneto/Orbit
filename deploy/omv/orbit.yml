# ---------------------------------------------------------------------------------------
# Orbit — stack para o OpenMediaVault (Serviços › Compose › Arquivos › Adicionar).
#
# Usa imagens prontas do GitHub (ghcr.io): o NAS não precisa do código nem compila nada.
# Os valores marcados com dois sublinhados no começo e no fim são preenchidos pelo script:
#     powershell -ExecutionPolicy Bypass -File .\scripts\generate-env.ps1 -Omv
# que gera deploy\omv\orbit-pronto.yml — é ESSE arquivo que você cola no OMV.
#
# Contêineres: web (site) → api → db (PostgreSQL) e redis. O "migrate" prepara o banco
# e para sozinho ("Exited" é o normal).
# ---------------------------------------------------------------------------------------

x-seguranca: &seguranca
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *seguranca
    image: ghcr.io/jmarquesneto/orbit-web:latest
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "__PORTA__:3000"
    networks: [rede-site, rede-interna]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000

  api:
    <<: *seguranca
    image: ghcr.io/jmarquesneto/orbit-api:latest
    environment:
      WEB_ORIGIN: "http://__IP_DO_NAS__:__PORTA__"
      DB_HOST: db
      DB_NAME: orbit
      DB_APP_USER: app_runtime
      DB_APP_PASSWORD: "__DB_APP_PASSWORD__"
      REDIS_HOST: redis
      REDIS_PASSWORD: "__REDIS_PASSWORD__"
      JWT_ACCESS_SECRET: "__JWT_ACCESS_SECRET__"
      JWT_REFRESH_SECRET: "__JWT_REFRESH_SECRET__"
      SESSION_SECRET: "__SESSION_SECRET__"
      DATA_ENCRYPTION_KEY: "__DATA_ENCRYPTION_KEY__"
      # Primeiro acesso: cria este administrador com uma senha provisória mostrada
      # no log deste contêiner (só se ainda não existir nenhum administrador).
      BOOTSTRAP_ADMIN_EMAIL: "__EMAIL_ADMIN__"
      BOOTSTRAP_ADMIN_NAME: "__NOME_ADMIN__"
    networks: [rede-interna, rede-dados]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  migrate:
    <<: *seguranca
    image: ghcr.io/jmarquesneto/orbit-api:latest
    restart: "no"
    command: ["node", "dist/infrastructure/database/migrate.js"]
    environment:
      DB_HOST: db
      DB_NAME: orbit
      DB_MIGRATOR_USER: app_migrator
      DB_MIGRATOR_PASSWORD: "__DB_MIGRATOR_PASSWORD__"
    networks: [rede-dados]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp

  db:
    <<: *seguranca
    image: ghcr.io/jmarquesneto/orbit-db:latest
    volumes:
      - __PASTA_DADOS__/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: "__DB_SUPERUSER_PASSWORD__"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      DB_MIGRATOR_USER: app_migrator
      DB_MIGRATOR_PASSWORD: "__DB_MIGRATOR_PASSWORD__"
      DB_APP_USER: app_runtime
      DB_APP_PASSWORD: "__DB_APP_PASSWORD__"
    # O PostgreSQL ajusta o dono da pasta de dados ao iniciar.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [rede-dados]
    shm_size: 128mb
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Só cache e limites de tentativa: não grava nada em disco.
  redis:
    <<: *seguranca
    image: redis:7.4-alpine
    user: redis
    command:
      - sh
      - -c
      - >-
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" |
        exec redis-server - --save "" --appendonly no --protected-mode yes
        --rename-command FLUSHALL "" --rename-command FLUSHDB "" --rename-command DEBUG ""
    environment:
      REDIS_PASSWORD: "__REDIS_PASSWORD__"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [rede-dados]
    read_only: true
    tmpfs:
      - /tmp
      - /data:uid=999,gid=1000

networks:
  rede-site:
  rede-interna:
    internal: true
  rede-dados:
    internal: true
